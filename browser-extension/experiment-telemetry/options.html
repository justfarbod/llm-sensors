<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Open WebUI Experiment Telemetry</title>
		<link rel="stylesheet" href="options.css" />
	</head>
	<body>
		<main>
			<h1>Experiment Telemetry</h1>
			<p>Choose the single Open WebUI origin where the extension is allowed to run.</p>
			<form id="form">
				<label for="origin">Open WebUI origin</label>
				<input id="origin" type="url" placeholder="http://localhost:8080" required />
				<button type="submit">Save origin</button>
			</form>
			<p id="status" role="status"></p>
		</main>
		<script src="options.js"></script>
	</body>
</html>
