stages:
  - build

variables:
  BUILDKITD_FLAGS: --oci-worker-no-process-sandbox
  BUILDKIT_CACHE_IMAGE: $CI_REGISTRY_IMAGE:buildcache

build-container-image:
  stage: build
  image:
    name: moby/buildkit:v0.30.0-rootless
    entrypoint: ['']
  interruptible: true
  before_script:
    - mkdir -p "$HOME/.docker"
    - |
      AUTH="$(printf '%s:%s' "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64 | tr -d '\n')"
      printf '{"auths":{"%s":{"auth":"%s"}}}\n' "$CI_REGISTRY" "$AUTH" > "$HOME/.docker/config.json"
  script:
    - |
      IMAGE_NAMES="$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"

      if [ -n "${CI_COMMIT_BRANCH:-}" ]; then
        IMAGE_NAMES="$IMAGE_NAMES,$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG"
      fi

      if [ "${CI_COMMIT_BRANCH:-}" = "$CI_DEFAULT_BRANCH" ]; then
        IMAGE_NAMES="$IMAGE_NAMES,$CI_REGISTRY_IMAGE:latest"
      fi

      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        case "$CI_COMMIT_TAG" in
          ''|[.-]*|*[!A-Za-z0-9_.-]*)
            echo "Git tag '$CI_COMMIT_TAG' is not a valid container tag." >&2
            exit 1
            ;;
          *) IMAGE_NAMES="$IMAGE_NAMES,$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG" ;;
        esac
      fi

      buildctl-daemonless.sh build \
        --frontend dockerfile.v0 \
        --local context=. \
        --local dockerfile=. \
        --opt build-arg:BUILD_HASH="$CI_COMMIT_SHA" \
        --import-cache type=registry,ref="$BUILDKIT_CACHE_IMAGE" \
        --export-cache type=registry,ref="$BUILDKIT_CACHE_IMAGE",mode=max \
        --output type=image,name="$IMAGE_NAMES",push=true
