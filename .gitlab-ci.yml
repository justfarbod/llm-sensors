# This project is developed and run directly from source. Keep an explicit CI
# configuration so GitLab Auto DevOps cannot infer the upstream Dockerfile and
# start an image build when Auto DevOps is enabled at group or instance level.
workflow:
  rules:
    - when: never

source-only:
  script:
    - echo "GitLab container builds are disabled for this source-only project."
  rules:
    - when: never
